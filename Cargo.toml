[workspace]
members = [".", "server", "stupid-kv-py"]
resolver = "2"

[package]
name = "stupid-kv"
edition = "2021"
version = "0.0.10"
description = "An in-memory MVCC key-value database with snapshot persistence, AOL incremental log, LZ4 compression, and an axum HTTP server. A learning project exploring database internals."
license = "MIT"
repository = "https://github.com/letterbeezps/stupid-kv"
readme = "README.md"
keywords = ["kv", "mvcc", "database", "transaction", "persistence"]
categories = ["database"]
documentation = "https://docs.rs/stupid-kv"

[dependencies]
arc-swap = "1.9.1"
bincode = { version = "2.0.1", features = ["serde"] }
bytes = { version = "1.11.1", features = ["serde"] }
crossbeam-deque = "0.8.7"
crossbeam-queue = "0.3.13"
crossbeam-skiplist = "0.1.3"
lz4 = "1.28.1"
papaya = "0.2.4"
parking_lot = "0.12.5"
smallvec = { version = "1.15.1", features = ["serde"] }
thiserror = "2.0.18"
tracing = "0.1.44"
web-time = "1.1.0"
